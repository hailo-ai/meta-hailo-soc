chip "scmi_sensors-virtual-0"
    label temp1 "H15 temperature 1"
    label temp2 "H15 temperature 2"
    label in0 "H15 VDD_CORE voltage"
    label in1 "H15 VDD_CORE voltage min"
    label in2 "H15 VDD_CORE min ch"
    label in3 "H15 VDD_CORE voltage max"
    label in4 "H15 VDD_CORE max ch"
# Convert channel to nV, this way value x will be printed as "x nV" instead of "x000 mV"
    compute in2 @/1000000, @
    compute in4 @/1000000, @