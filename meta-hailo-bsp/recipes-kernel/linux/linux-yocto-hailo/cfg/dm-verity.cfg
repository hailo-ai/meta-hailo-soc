# DM-Verity support
CONFIG_DM_INIT=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_DM_VERITY_FEC=y

# Crypto support needed for dm-verity
CONFIG_CRYPTO=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_HASH=y
CONFIG_CRYPTO_HASH2=y
CONFIG_CRYPTO_MANAGER=y
CONFIG_CRYPTO_MANAGER2=y

# Additional crypto algorithms that might be needed
CONFIG_CRYPTO_SHA256_SSSE3=y
CONFIG_CRYPTO_SHA256_ARM64=y

CONFIG_MTD_BLOCK=y
CONFIG_MTD_BLOCK_RO=y
CONFIG_MTD_PHRAM=y